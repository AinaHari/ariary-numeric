services:
  web:
    build: .
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8001,http://127.0.0.1:8001"
    volumes:
      - media_data:/app/backend/media
    restart: unless-stopped

volumes:
  media_data: