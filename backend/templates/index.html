<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<title>Ariary Numeric — Client web</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  /* Binance-inspired dark palette */
  --bg: #000000;
  --bg-2: #0A0A0A;
  --bg-3: #111111;
  --bg-4: #1A1A1A;
  --card: #0D0D0D;
  --card-hover: #1A1A1A;
  --border: #2A2A2A;
  --border-2: #3A3A3A;
  --accent: #FCD535;
  --accent-light: #FFE066;
  --accent-dark: #E6C200;
  --green: #00C853;
  --green-dark: #009624;
  --red: #F6465D;
  --red-dark: #D9304A;
  --blue: #1E80FF;
  --purple: #7B61FF;
  --orange: #F0943E;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 2px 8px rgba(0,0,0,.4);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.5);
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-xl: 12px;
  --r-full: 9999px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --ease-fast: 150ms var(--ease);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; background: var(--bg); }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.4;
  font-size: 14px;
}
/* Header */
header {
  background: var(--bg-2);
  color: var(--text);
  padding: 0 20px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}
header .brand { display: flex; align-items: center; gap: 10px; }
header .brand .logo-mark {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
header .brand .logo-mark svg { width: 18px; height: 18px; stroke: #000; }
header .brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.2px; color: var(--text); }
header .brand .tag { font-size: 10px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
header .right { display: flex; align-items: center; gap: 10px; }
header .user { font-size: 13px; color: var(--text-2); font-weight: 500; }
select.lang {
  padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--border);
  background: var(--bg-3); color: var(--text); font-size: 12px; font-weight: 600;
  cursor: pointer; outline: none; transition: border-color .15s ease;
}
select.lang:hover { border-color: var(--accent); }
select.lang option { color: var(--text); background: var(--bg-3); }
/* Nav */
nav {
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex; gap: 0; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  position: sticky; top: 56px; z-index: 90;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  border: none; background: transparent; color: var(--muted);
  padding: 12px 16px; cursor: pointer; font-size: 13px; font-weight: 600;
  white-space: nowrap;
  transition: color .15s ease;
  display: inline-flex; align-items: center; gap: 6px;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
nav button:hover { color: var(--text); }
nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
nav button .ic { width: 14px; height: 14px; }
/* Main */
main { max-width: 1280px; margin: 16px auto 48px; padding: 0 16px; }
@media (max-width: 640px) { main { padding: 0 12px; margin: 12px auto 40px; } }

/* Balance card */
.balance-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px;
  margin-bottom: 16px;
  position: relative;
}
.balance-card .label { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.balance-card .value { font-size: 32px; font-weight: 700; color: var(--text); font-family: var(--mono); letter-spacing: -.5px; line-height: 1; margin-bottom: 4px; }
.balance-card .sub { font-size: 12px; color: var(--muted); }
.balance-card .demo-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(240,185,11,.12); color: var(--accent);
  padding: 3px 8px; border-radius: var(--r-sm); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px;
}
.balance-card .demo-tag::before { content: '⚠'; }

/* Hero */
.hero {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.hero::before { content: ''; position: absolute; top: 0; right: 0; width: 200px; height: 100%; background: linear-gradient(90deg, transparent, rgba(240,185,11,.03)); pointer-events: none; }
.hero h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; color: var(--text); letter-spacing: -.3px; }
.hero p { font-size: 13px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
.hero .cta { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .illustration { position: absolute; right: 20px; bottom: -20px; width: 360px; max-width: 45%; opacity: .95; filter: drop-shadow(0 16px 32px rgba(0,0,0,.3)); pointer-events: none; z-index: 0; }
@media (max-width: 768px) { .hero .illustration { display: none; } .hero { padding: 20px 16px; } .hero h1 { font-size: 20px; } }

/* Feature grids */
.feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
.feat {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 16px;
  transition: border-color .15s ease, background .15s ease;
}
.feat:hover { border-color: var(--border-2); background: var(--bg-4); }
.feat .ic {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  background: rgba(240,185,11,.1); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 16px; margin-bottom: 10px;
}
.feat .ic svg { width: 16px; height: 16px; stroke: var(--accent); }
.feat h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--text); }
.feat p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }

.tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-bottom: 16px; }
.tile {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 8px;
  text-align: center;
  cursor: pointer; font-weight: 500; font-size: 12px; color: var(--text-2);
  transition: all .15s var(--ease);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.tile:hover { border-color: var(--accent); color: var(--text); background: var(--bg-4); }
.tile .ic { font-size: 18px; color: var(--muted); transition: color .15s ease; }
.tile:hover .ic { color: var(--accent); }
.tile span { position: relative; z-index: 1; }

/* Empty state */
.empty { text-align: center; padding: 40px 20px; }
.empty .illustration { width: 80px; height: 80px; margin: 0 auto 12px; opacity: .3; }
.empty h4 { margin: 0 0 6px; color: var(--text); font-weight: 600; font-size: 15px; }
.empty p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

/* Forms */
label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
input, select, textarea {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 14px; font-family: inherit;
  background: var(--bg-2); color: var(--text);
  transition: border-color .15s ease;
}
input::placeholder { color: var(--muted-2); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--bg-3); }
input:hover:not(:focus) { border-color: var(--border-2); }

/* Buttons */
button.primary {
  background: var(--accent); color: #000; border: none;
  padding: 10px 20px; border-radius: var(--r-sm); cursor: pointer;
  font-size: 14px; font-weight: 600; font-family: inherit;
  transition: background .15s ease, opacity .15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
button.primary:hover { background: var(--accent-light); }
button.primary:active { opacity: .85; }
button.primary.secondary {
  background: var(--bg-4); color: var(--text); border: 1px solid var(--border);
}
button.primary.secondary:hover { background: var(--border-2); }
button.primary.danger { background: var(--red); color: #fff; }
button.primary.danger:hover { background: var(--red-dark); }

button.ghost {
  background: transparent; color: var(--accent); border: 1px solid var(--border);
  padding: 9px 18px; border-radius: var(--r-sm); cursor: pointer;
  font-size: 14px; font-weight: 600; font-family: inherit;
  transition: all .15s var(--ease);
  display: inline-flex; align-items: center; gap: 6px;
}
button.ghost:hover { border-color: var(--accent); background: rgba(240,185,11,.05); }

button.danger {
  background: var(--red); color: #fff; border: none;
  padding: 8px 16px; border-radius: var(--r-sm); cursor: pointer;
  font-weight: 600; font-family: inherit;
  transition: filter .15s ease;
}
button.danger:hover { filter: brightness(.9); }

button.link {
  background: none; border: none; color: var(--accent); cursor: pointer;
  font-weight: 600; padding: 4px 0; font-family: inherit; font-size: 13px;
}
button.link:hover { text-decoration: underline; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th {
  background: var(--bg-2); color: var(--muted); font-weight: 600;
  font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
  position: sticky; top: 0;
}
tbody tr { transition: background .1s ease; }
tbody tr:hover { background: var(--bg-3); }
tbody tr:last-child td { border-bottom: none; }
td { color: var(--text); font-family: var(--mono); font-size: 13px; }
td.text { font-family: var(--font); }

/* Messages */
.msg {
  padding: 10px 14px; border-radius: var(--r-sm); margin: 10px 0;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
}
.msg.ok { background: rgba(14,203,129,.1); color: var(--green); border-left: 3px solid var(--green); }
.msg.err { background: rgba(246,70,93,.1); color: var(--red); border-left: 3px solid var(--red); }

/* Login */
.login-box { max-width: 400px; margin: 40px auto; }
.login-box h2 { font-size: 22px; font-weight: 700; color: var(--text); margin: 0 0 4px; }
.login-box .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: var(--r-sm); font-size: 11px; font-weight: 600;
  background: var(--bg-4); color: var(--muted);
}
.badge.unread { background: rgba(240,185,11,.12); color: var(--accent); }
.badge.success { background: rgba(14,203,129,.12); color: var(--green); }
.badge.danger { background: rgba(246,70,93,.12); color: var(--red); }
.badge.info { background: rgba(30,128,255,.12); color: var(--blue); }

/* Layout utilities */
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.col { flex: 1; min-width: 240px; }
.title { font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 12px; }
.muted { color: var(--muted); font-size: 13px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.hidden { display: none !important; }

/* Demo banner */
.demo-banner {
  background: rgba(240,185,11,.08);
  border: 1px solid rgba(240,185,11,.25);
  border-radius: var(--r-sm);
  padding: 10px 14px; margin-bottom: 16px;
  font-size: 12px; color: var(--accent); line-height: 1.5;
  display: flex; align-items: flex-start; gap: 8px;
}
.demo-banner .ic { font-size: 14px; flex-shrink: 0; }
.demo-banner strong { color: var(--accent-light); }

/* Toast */
#toast { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg-3); color: var(--text);
  padding: 12px 16px; border-radius: var(--r-md);
  box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 500;
  animation: slideIn .2s var(--ease); max-width: 320px;
  border: 1px solid var(--border);
}
.toast.ok { background: rgba(14,203,129,.15); color: var(--green); border-color: rgba(14,203,129,.3); }
.toast.err { background: rgba(246,70,93,.15); color: var(--red); border-color: rgba(246,70,93,.3); }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

/* Icon & utilities */
.ic { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Responsive */
@media (max-width: 768px) {
  header { padding: 0 12px; height: 52px; }
  header .brand h1 { font-size: 15px; }
  header .brand .tag { display: none; }
  nav { padding: 0 8px; top: 52px; }
  nav button { padding: 10px 12px; font-size: 12px; }
  main { padding: 0 12px; margin: 12px auto 40px; }
  .card { padding: 16px; border-radius: var(--r-md); }
  .balance-card { padding: 18px 16px; }
  .balance-card .value { font-size: 26px; }
  .hero { padding: 20px 16px; }
  .hero h1 { font-size: 20px; }
  .tile-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tile { padding: 12px 6px; font-size: 11px; }
  .feat-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .tile-grid { grid-template-columns: repeat(2, 1fr); }
  .hero .cta { flex-direction: column; }
  .hero .cta button { width: 100%; justify-content: center; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

/* Focus & selection */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(240,185,11,.2); color: var(--accent-light); }

/* Text utilities */
.text-green { color: var(--green); }
.text-red { color: var(--red); }
.text-accent { color: var(--accent); }
.text-muted { color: var(--muted); }
.font-mono { font-family: var(--mono); }
.text-right { text-align: right; }
.flex { display: flex; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.gap-8 { gap: 8px; }
.mb-16 { margin-bottom: 16px; }
.mt-16 { margin-top: 16px; }
</style>
</head>

function t(key) {
  const L = I18N[lang] || I18N.fr;
  if (Object.prototype.hasOwnProperty.call(L, key)) return L[key];
  if (Object.prototype.hasOwnProperty.call(I18N.fr, key)) return I18N.fr[key];
  return key;
}
function tmap(key, k, fallback) {
  const L = I18N[lang] || I18N.fr;
  const grp = (L && L[key]) || I18N.fr[key] || {};
  return grp[k] !== undefined ? grp[k] : (fallback !== undefined ? fallback : k);
}
function setLang(l, syncServer=true) {
  if (!I18N[l]) l = 'fr';
  lang = l;
  localStorage.setItem('lang', l);
  document.getElementById('langSel').value = l;
  document.documentElement.lang = l;
  buildNav(); if (user) setUserLabel();;
  if (currentView) view(currentView); else viewLanding();
  if (user && syncServer) api('PATCH', '/accounts/me/', { preferred_language: l });
  matchLang();
}
function matchLang() {
  const sel = document.getElementById('langSel');
  sel.onchange = () => setLang(sel.value);
}

function fmt(n) {
  if (n === undefined || n === null) return '—';
  const x = Number(n);
  if (isNaN(x)) return String(n);
  try { return x.toLocaleString(lang === 'en' ? 'en-GB' : 'fr-FR') + ' Ar'; } catch (e) { return x + ' Ar'; }
}

function headers() { const h = {'Content-Type':'application/json'}; if (token) h['Authorization'] = 'Token ' + token; return h; }
async function api(method, path, body) {
  try {
    const r = await fetch(API + path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
    let data = null;
    try { data = await r.json(); } catch(e) { data = await r.text(); }
    return { status: r.status, data };
  } catch (e) { return { status: 0, data: t('err_unreachable') }; }
}
function msg(text, ok=true) {
  const d = document.createElement('div');
  d.className = 'msg ' + (ok ? 'ok' : 'err');
  d.textContent = text;
  return d;
}
function clearMain() { document.getElementById('main').innerHTML = ''; }
function showNav(show) { document.getElementById('nav').classList.toggle('hidden', !show); }
function setUserLabel() { document.getElementById('userLabel').textContent = user ? ((user.first_name || user.email) + ' — demo') : t('guest_try'); }

async function downloadAuth(path, filename) {
  try {
    const r = await fetch(API + path, { headers: token ? {'Authorization':'Token '+token} : {} });
    if (!r.ok) { alert(fmtErr({status:r.status,data:await r.text()})); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename || 'document'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { alert(t('err_unreachable')); }
}

function fmtErr(res) {
  if (!res || res.status === 0) return t('err_unreachable');
  const d = res.data;
  if (typeof d === 'string') return d;
  if (d && d.detail) return d.detail;
  if (d && d.message) return d.message;
  if (d && typeof d === 'object') {
    return Object.entries(d).map(([k,v]) => Array.isArray(v) ? k+': '+v.join(', ') : k+': '+v).join(' | ');
  }
  return 'HTTP ' + res.status;
}

function paginateToItems(res) {
  return (res && res.data && res.data.results) ? res.data.results : (Array.isArray(res && res.data) ? res.data : []);
}

    <label>${t('pay_est_oc')}</label><input id="ic_oc" value="MGA">
    <label>${t('pay_est_dc')}</label><input id="ic_dc" value="EUR">
    <label>${t('pay_est_amount')}</label><input id="ic_amt" type="number" value="100000">
    <div style="margin-top:8px"><button class="primary" id="ic_btn">${t('pay_est_btn')}</button></div>
    <div id="ic_res" style="margin-top:8px"></div>`;
  main.appendChild(c2);document.getElementById('ic_btn').addEventListener('click', async () => {
    const payload = { origin_country: document.getElementById('ic_o').value, destination_country: document.getElementById('ic_d').value, origin_currency: document.getElementById('ic_oc').value, destination_currency: document.getElementById('ic_dc').value, amount: parseFloat(document.getElementById('ic_amt').value) };
    const res = await api('POST','/payments/international/estimate/', payload);
    const div = document.getElementById('ic_res');
    div.innerHTML = '';
    if (res.status === 200 || res.status === 201) {
      const d = res.data;
      div.innerHTML = `<p><b>${t('pay_ref')}:</b> ${d.reference}</p><p>${t('pay_rate')}: ${d.rate} (${d.rate_source})</p><p>${t('pay_est_fee')}: ${fmt(d.estimated_fee)} ${d.origin_currency}</p><p>${t('pay_est_receive')}: ${d.estimated_receive} ${d.destination_currency}</p><p>${t('table_status')}: ${d.status}</p><p class="muted">${d.note||''}</p>`;
    } else div.appendChild(msg(fmtErr(res), false));
  });
  // mes estimations
  const intl = await api('GET','/payments/international/');
  const c3 = document.createElement('div'); c3.className='card';
  c3.innerHTML = `<h3 class="title">${t('pay_my')}</h3>`;
  const iitems = paginateToItems(intl);
  if (!iitems.length) c3.appendChild(document.createTextNode(t('pay_none')));
  else {
    const tbl = document.createElement('table'); tbl.innerHTML = `<tr><th>${t('pay_ref')}</th><th>${t('table_amount')}</th><th>${t('pay_est_receive')}</th><th>${t('table_status')}</th></tr>`;
    iitems.forEach(x => { const tr=document.createElement('tr'); tr.innerHTML=`<td>${String(x.reference).slice(0,12)}</td><td>${fmt(x.amount)} ${x.origin_currency}</td><td>${x.estimated_receive} ${x.destination_currency}</td><td>${x.status}</td>`; tbl.appendChild(tr); });
    c3.appendChild(tbl);
  }
  main.appendChild(c3);
}

// ---------- Notifications ----------
async function viewNotifications() {
  clearMain();
  currentView = 'notifications';
  const main = document.getElementById('main');
  const r = await api('GET','/notifications/');
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h3 class="title">${t('notif_title')}</h3><div style="margin-bottom:8px"><button class="primary" id="readAll">${t('notif_readall')}</button></div>`;
  main.appendChild(card);document.getElementById('readAll').addEventListener('click', async () => { await api('POST','/notifications/read-all/'); viewNotifications(); });
  const items = paginateToItems(r);
  if (!items.length) card.appendChild(document.createTextNode(t('notif_none')));
  else items.forEach(n => {
    const div = document.createElement('div'); div.style.padding='8px'; div.style.borderBottom='1px solid #eee';
    div.innerHTML = `<b>${n.title}</b> <span class="badge ${n.is_read?'':'unread'}">${n.is_read?t('notif_read_lbl'):t('notif_unread_lbl')}</span><br><span class="muted">${(n.created_at||'').slice(0,19).replace('T',' ')}</span><br>${n.message}`;
    if (!n.is_read) {
      const b = document.createElement('button'); b.textContent = t('notif_read'); b.style.marginTop='4px';b.addEventListener('click', async () => { await api('POST','/notifications/'+n.id+'/read/'); viewNotifications(); });
      div.appendChild(b);
    }
    card.appendChild(div);
  });
}

// ---------- Profile ----------
async function viewProfile() {
  clearMain();
  currentView = 'profile';
  const main = document.getElementById('main');
  const r = await api('GET','/accounts/me/');
  const card = document.createElement('div'); card.className='card';
  if (r.status !== 200) { card.appendChild(msg(fmtErr(r), false)); main.appendChild(card); return; }
  const d = r.data;
  card.innerHTML = `<h3 class="title">${t('prof_title')}</h3>
    <p class="muted">${d.email} — ${t('prof_created')} ${(d.created_at||'').slice(0,10)}</p>
    <label>${t('reg_first')}</label><input id="pf_first" value="${(d.first_name||'').replace('"','&quot;')}">
    <label>${t('reg_last')}</label><input id="pf_last" value="${(d.last_name||'').replace('"','&quot;')}">
    <label>${t('reg_phone')}</label><input id="pf_phone" value="${(d.phone||'').replace('"','&quot;')}">
    <label>${t('cust_origin')}</label><input id="pf_country" value="${(d.country||'').replace('"','&quot;')}">
    <label>${t('prof_lang')}</label><select id="pf_lang">
      <option value="fr">Français</option><option value="mg">Malagasy</option><option value="en">English</option>
    </select>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="primary" id="pf_save">${t('prof_save')}</button>
      <button class="danger" id="pf_logout">${t('prof_logout')}</button>
    </div>`;
  main.appendChild(card);
  document.getElementById('pf_lang').value = d.preferred_language || lang || 'fr';document.getElementById('pf_save').addEventListener('click', async () => {
    const payload = { first_name: document.getElementById('pf_first').value, last_name: document.getElementById('pf_last').value, phone: document.getElementById('pf_phone').value, country: document.getElementById('pf_country').value, preferred_language: document.getElementById('pf_lang').value };
    const res = await api('PATCH','/accounts/me/', payload);
    if (res.status === 200) { user = res.data; localStorage.setItem('user',JSON.stringify(user)); setUserLabel(); card.appendChild(msg(t('prof_saved'))); }
    else card.appendChild(msg(fmtErr(res), false));
  });document.getElementById('pf_logout').addEventListener('click', async () => {
    await api('POST','/accounts/logout/');
    token = null; user = null; localStorage.removeItem('token'); localStorage.removeItem('user');
    setUserLabel(); showNav(false); viewLogin();
  });
}

// ---------- QR Code ----------
async function viewQr() {
  clearMain();
  currentView = 'qr';
  const main = document.getElementById('main');
  const me = JSON.parse(localStorage.getItem('user') || '{}');
  const email = me.email || '';
  const payload = 'ariary://pay?to=' + email;
  const card = document.createElement('div'); card.className='card'; card.style.textAlign='center';
  card.innerHTML = `<h3 class="title">${t('qr_title')}</h3>
    <p class="muted">${t('qr_code')} : ${email}</p>
    <canvas id="qrCanvas" style="margin:12px auto;display:block"></canvas>
    <p class="muted" style="word-break:break-all">${payload}</p>
    <h4 style="margin-top:16px">${t('qr_scan')}</h4>
    <label>${t('qr_payload')}</label><input id="qr_input">
    <label>${t('qr_amount')}</label><input id="qr_amt" type="number" value="100">
    <div style="margin-top:8px"><button class="primary" id="qr_pay">${t('qr_pay')}</button></div>`;
  main.appendChild(card);
  try { if (window.QRCode) QRCode.toCanvas(document.getElementById('qrCanvas'), payload, { width: 220 }); } catch(e) {}
  document.getElementById('qr_pay').addEventListener('click', async () => {
    const val = parseFloat(document.getElementById('qr_amt').value);
    let to = document.getElementById('qr_input').value.trim();
    if (to.includes('to=')) to = to.split('to=').pop();
    if (!to) { card.appendChild(msg(t('qr_need_to'), false)); return; }
    if (isNaN(val) || val <= 0) { card.appendChild(msg(t('q_amount_invalid'), false)); return; }
    const res = await api('POST','/wallet/transfer/', { recipient_email: to, amount: val, description: 'Paiement QR', idempotency_key: crypto.randomUUID() });
    if (res.status === 201 || res.status === 200) { card.appendChild(msg(t('qr_ok'))); setTimeout(()=>view('wallet'),900); }
    else card.appendChild(msg(fmtErr(res), false));
  });
}

// ---------- Router ----------
const views = { dashboard:viewDashboard, wallet:viewWallet, transfer:viewTransfer, topup:viewTopup, history:viewHistory, txdetail:viewTxdetail, shipments:viewShipments, shipmentcreate:viewShipmentcreate, shipmentdetail:viewShipmentdetail, customs:viewCustoms, customscreate:viewCustomscreate, customsdetail:viewCustomsdetail, blockchain:viewBlockchain, payments:viewPayments, notifications:viewNotifications, profile:viewProfile, qr:viewQr, landing:viewLanding, login:viewLogin, register:viewRegister };
function view(name) {
  currentView = name && views[name] ? name : 'dashboard';
  if (views[currentView]) views[currentView]();
  else viewDashboard();
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('active', x.dataset.view === currentView));
}
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const items = [
    ['dashboard', t('nav_dashboard'), 'home'], ['wallet', t('nav_wallet'), 'wallet'], ['transfer', t('nav_transfer'), 'send'], ['topup', t('nav_topup'), 'trending-up'],
    ['history', t('nav_history'), 'credit-card'], ['shipments', t('nav_shipments'), 'package'], ['customs', t('nav_customs'), 'file-text'], ['blockchain', t('nav_blockchain'), 'shield'],
    ['qr', t('nav_qr'), 'qr-code'], ['notifications', t('nav_notifications'), 'bell'], ['profile', t('nav_profile'), 'user'],
  ];
  items.forEach(([v, label, ic]) => {
    const b = document.createElement('button');
    b.dataset.view = v;
    b.innerHTML = icon(ic) + ' ' + label;
    b.addEventListener('click', () => view(v));
    nav.appendChild(b);
  });
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.view === currentView));
}

// ---------- Boot ----------
(function boot() {
  if (!lang) lang = (user && user.preferred_language) || 'fr';
  lang = I18N[lang] ? lang : 'fr';
  document.getElementById('langSel').value = lang;
  document.documentElement.lang = lang;
  matchLang();
  buildNav();
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const a = btn.dataset.action;
    if (a === 'login') viewLogin();
    else if (a === 'register') viewRegister();
    else if (a === 'guest') guestLogin(document.querySelector('.hero'));
  });
  if (token && user) { setUserLabel(); showNav(true); view('dashboard'); }
  else { setUserLabel(); showNav(false); viewLanding(); }
})();
</script>
