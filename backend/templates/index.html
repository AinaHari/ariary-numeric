<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<title>Ariary Numeric — Client web</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  --bg: #0B0E11;
  --bg-2: #161A1E;
  --bg-3: #1E2329;
  --bg-4: #2B3139;
  --card: #1E2329;
  --card-hover: #2B3139;
  --text: #EAECEF;
  --text-2: #B7BDC6;
  --muted: #848E9C;
  --muted-2: #5E6673;
  --border: #2B3139;
  --border-2: #3C424D;
  --accent: #FCD535;
  --accent-light: #FFE066;
  --accent-dark: #E6C200;
  --green: #0ECB81;
  --green-dark: #0BA360;
  --red: #F6465D;
  --red-dark: #D9304A;
  --blue: #1E80FF;
  --purple: #7B61FF;
  --orange: #F0943E;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 2px 8px rgba(0,0,0,.4);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.5);
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-xl: 12px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; background: var(--bg); }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  line-height: 1.4;
  font-size: 14px;
  padding-bottom: 72px;
}

/* ---------- Header ---------- */
header {
  background: var(--bg-2);
  color: var(--text);
  padding: 0 16px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid var(--border);
}
header .brand { display: flex; align-items: center; gap: 10px; }
header .brand .logo-mark {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
header .brand .logo-mark svg { width: 18px; height: 18px; stroke: #000; }
header .brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.2px; color: var(--text); }
header .brand .greeting { font-size: 11px; color: var(--muted); font-weight: 500; }
header .right { display: flex; align-items: center; gap: 8px; }
header .user { font-size: 13px; color: var(--text-2); font-weight: 500; }
select.lang {
  padding: 6px 10px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--bg-3); color: var(--text);
  font-size: 12px; font-weight: 600; cursor: pointer; outline: none;
}
select.lang option { color: var(--text); background: var(--bg-3); }
button.icon-btn {
  background: var(--bg-3); border: 1px solid var(--border); color: var(--muted);
  width: 36px; height: 36px; border-radius: var(--r-sm); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  transition: all .15s var(--ease);
}
button.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- Bottom Nav (4 sections) ---------- */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-2); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  height: 64px; padding: 0 8px;
  box-shadow: 0 -2px 10px rgba(0,0,0,.3);
}
.bottom-nav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 8px 4px; font-size: 10px; font-weight: 600; font-family: inherit;
  transition: color .15s ease; border-radius: var(--r-sm);
  max-width: 80px;
}
.bottom-nav button.active { color: var(--accent); }
.bottom-nav button .ic { font-size: 20px; }
.bottom-nav button:hover { color: var(--text); }

/* Desktop sidebar */
@media (min-width: 769px) {
  body { padding-bottom: 0; padding-left: 220px; }
  .bottom-nav {
    position: fixed; left: 0; top: 56px; bottom: 0; right: auto;
    width: 220px; height: auto; flex-direction: column;
    justify-content: flex-start; gap: 4px; padding: 16px 8px;
    border-top: none; border-right: 1px solid var(--border);
    box-shadow: 2px 0 10px rgba(0,0,0,.2);
  }
  .bottom-nav button {
    flex: none; width: 100%; flex-direction: row; justify-content: flex-start;
    gap: 12px; padding: 12px 16px; font-size: 14px; max-width: none;
    border-radius: var(--r-md);
  }
  .bottom-nav button .ic { font-size: 18px; }
  .bottom-nav button.active { background: rgba(252,213,53,.08); }
  main { margin-left: 0; }
}

/* ---------- Main ---------- */
main { max-width: 1200px; margin: 16px auto 24px; padding: 0 16px; }
@media (max-width: 640px) { main { padding: 0 12px; margin: 12px auto 20px; } }

/* ---------- Cards ---------- */
.card {
  background: var(--card); border-radius: var(--r-lg); padding: 16px;
  border: 1px solid var(--border); margin-bottom: 12px;
  transition: border-color .15s ease;
  animation: fadeIn .2s var(--ease);
}
.card:hover { border-color: var(--border-2); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Balance card ---------- */
.balance-card {
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px;
}
.balance-card .label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.balance-card .value { font-size: 32px; font-weight: 700; color: var(--text); font-family: var(--mono); letter-spacing: -0.5px; line-height: 1; margin-bottom: 4px; }
.balance-card .sub { font-size: 12px; color: var(--muted); }
.balance-card .demo-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(252,213,53,.1); color: var(--accent);
  padding: 3px 8px; border-radius: var(--r-sm);
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 10px;
}
.balance-card .demo-tag::before { content: '⚠ '; }

/* ---------- Quick actions ---------- */
.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.quick-action {
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 14px 8px;
  text-align: center; cursor: pointer;
  font-weight: 500; font-size: 11px; color: var(--text-2);
  transition: all .15s var(--ease);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.quick-action:hover { border-color: var(--accent); color: var(--text); }
.quick-action .ic { font-size: 20px; color: var(--accent); }
.quick-action span { position: relative; z-index: 1; }

/* ---------- Tiles ---------- */
.tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-bottom: 16px; }
.tile {
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 14px 8px;
  text-align: center; cursor: pointer;
  font-weight: 500; font-size: 12px; color: var(--text-2);
  transition: all .15s var(--ease);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.tile:hover { border-color: var(--accent); color: var(--text); background: var(--bg-4); }
.tile .ic { font-size: 18px; color: var(--muted); transition: color .15s ease; }
.tile:hover .ic { color: var(--accent); }

/* ---------- Feat grid ---------- */
.feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 16px; }
.feat {
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 14px;
  transition: border-color .15s ease;
}
.feat:hover { border-color: var(--border-2); }
.feat .ic { width: 28px; height: 28px; border-radius: var(--r-sm); background: rgba(252,213,53,.1); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 14px; margin-bottom: 8px; }
.feat .ic svg { width: 14px; height: 14px; stroke: var(--accent); }
.feat h4 { margin: 0 0 3px; font-size: 13px; font-weight: 600; color: var(--text); }
.feat p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }

/* ---------- Forms ---------- */
label { display: block; font-size: 11px; font-weight: 600; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
input, select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm);
  font-size: 14px; font-family: inherit; background: var(--bg-2); color: var(--text);
  transition: border-color .15s ease;
}
input::placeholder { color: var(--muted-2); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--bg-3); }
input:hover:not(:focus) { border-color: var(--border-2); }

/* ---------- Buttons ---------- */
button.primary {
  background: var(--accent); color: #000; border: none;
  padding: 10px 18px; border-radius: var(--r-sm); cursor: pointer;
  font-size: 14px; font-weight: 600; font-family: inherit;
  transition: background .15s ease, opacity .15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
button.primary:hover { background: var(--accent-light); }
button.primary:active { opacity: .85; }
button.primary.secondary { background: var(--bg-4); color: var(--text); border: 1px solid var(--border); }
button.primary.secondary:hover { background: var(--border-2); }
button.primary.danger { background: var(--red); color: #fff; }
button.primary.danger:hover { background: var(--red-dark); }

button.ghost {
  background: transparent; color: var(--accent); border: 1px solid var(--border);
  padding: 9px 16px; border-radius: var(--r-sm); cursor: pointer;
  font-size: 14px; font-weight: 600; font-family: inherit;
  transition: all .15s var(--ease);
  display: inline-flex; align-items: center; gap: 6px;
}
button.ghost:hover { border-color: var(--accent); background: rgba(252,213,53,.05); }

button.danger {
  background: var(--red); color: #fff; border: none;
  padding: 8px 16px; border-radius: var(--r-sm); cursor: pointer;
  font-weight: 600; font-family: inherit; transition: filter .15s ease;
}
button.danger:hover { filter: brightness(.9); }

button.link { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; padding: 4px 0; font-family: inherit; font-size: 13px; }
button.link:hover { text-decoration: underline; }

/* ---------- Tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: var(--bg-2); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
tbody tr { transition: background .1s ease; }
tbody tr:hover { background: var(--bg-3); }
tbody tr:last-child td { border-bottom: none; }
td { color: var(--text); font-family: var(--mono); font-size: 13px; }
td.text { font-family: var(--font); }

/* ---------- Messages ---------- */
.msg { padding: 10px 14px; border-radius: var(--r-sm); margin: 10px 0; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.msg.ok { background: rgba(14,203,129,.1); color: var(--green); border-left: 3px solid var(--green); }
.msg.err { background: rgba(246,70,93,.1); color: var(--red); border-left: 3px solid var(--red); }

/* ---------- Auth box ---------- */
.login-box { max-width: 400px; margin: 40px auto; }
.login-box h2 { font-size: 22px; font-weight: 700; color: var(--text); margin: 0 0 4px; }
.login-box .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--r-sm); font-size: 11px; font-weight: 600; background: var(--bg-4); color: var(--muted); }
.badge.unread { background: rgba(252,213,53,.12); color: var(--accent); }
.badge.success { background: rgba(14,203,129,.12); color: var(--green); }
.badge.danger { background: rgba(246,70,93,.12); color: var(--red); }
.badge.info { background: rgba(30,128,255,.12); color: var(--blue); }

/* ---------- Layout ---------- */
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.col { flex: 1; min-width: 240px; }
.title { font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 12px; }
.muted { color: var(--muted); font-size: 13px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.hidden { display: none !important; }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding: 40px 20px; }
.empty .illustration { width: 80px; height: 80px; margin: 0 auto 12px; opacity: .3; }
.empty h4 { margin: 0 0 6px; color: var(--text); font-weight: 600; font-size: 15px; }
.empty p { margin: 0 0 16px; color: var(--muted); font-size: 13px; max-width: 360px; margin-left: auto; margin-right: auto; }

/* ---------- Demo warning banner ---------- */
.demo-banner {
  background: rgba(252,213,53,.08); border: 1px solid rgba(252,213,53,.25);
  border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 16px;
  font-size: 12px; color: var(--accent); line-height: 1.5;
  display: flex; align-items: flex-start; gap: 8px;
}
.demo-banner .ic { font-size: 14px; flex-shrink: 0; }
.demo-banner strong { color: var(--accent-light); }

/* ---------- Toast ---------- */
#toast { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--bg-3); color: var(--text); padding: 12px 16px; border-radius: var(--r-md); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 500; animation: slideIn .2s var(--ease); max-width: 320px; border: 1px solid var(--border); }
.toast.ok { background: rgba(14,203,129,.15); color: var(--green); border-color: rgba(14,203,129,.3); }
.toast.err { background: rgba(246,70,93,.15); color: var(--red); border-color: rgba(246,70,93,.3); }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

/* ---------- Icon ---------- */
.ic { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Responsive ---------- */
@media (max-width: 768px) {
  header { padding: 0 12px; height: 52px; }
  header .brand h1 { font-size: 15px; }
  header .brand .tag { display: none; }
  nav { padding: 0 8px; top: 52px; }
  nav button { padding: 10px 12px; font-size: 12px; }
  main { padding: 0 12px; margin: 12px auto 20px; }
  .card { padding: 16px; border-radius: var(--r-md); }
  .balance-card { padding: 18px 16px; }
  .balance-card .value { font-size: 26px; }
  .quick-actions { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .quick-action { padding: 12px 6px; font-size: 11px; }
  .feat-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .quick-actions { grid-template-columns: repeat(2, 1fr); }
}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

/* ---------- Focus ---------- */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Selection ---------- */
::selection { background: rgba(252,213,53,.2); color: var(--accent-light); }

/* ---------- Utility ---------- */
.text-green { color: var(--green); }
.text-red { color: var(--red); }
.text-accent { color: var(--accent); }
.text-muted { color: var(--muted); }
.font-mono { font-family: var(--mono); }
.text-right { text-align: right; }
.flex { display: flex; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.gap-8 { gap: 8px; }
.mb-16 { margin-bottom: 16px; }
.mt-16 { margin-top: 16px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
    </div>
    <div>
      <h1>Ariary Numeric</h1>
      <div class="greeting">Portefeuille numérique · Madagascar</div>
    </div>
  </div>
  <div class="right">
    <select class="lang" id="langSel" title="Language">
      <option value="fr">FR</option>
      <option value="mg">MG</option>
      <option value="en">EN</option>
    </select>
    <div class="user" id="userLabel">…</div>
    <button class="icon-btn" id="notifBtn" onclick="view('notifications')" title="Notifications">🔔</button>
  </div>
</header>

<nav class="bottom-nav" id="nav"></nav>

<main id="main"></main>

<div id="toast"></div>

function t(key) { const L = I18N[lang] || I18N.fr; if (Object.prototype.hasOwnProperty.call(L, key)) return L[key]; if (Object.prototype.hasOwnProperty.call(I18N.fr, key)) return I18N.fr[key]; return key; }
function tmap(key, k, fallback) { const L = I18N[lang] || I18N.fr; const grp = (L && L[key]) || I18N.fr[key] || {}; return grp[k] !== undefined ? grp[k] : (fallback !== undefined ? fallback : k); }
function setLang(l, syncServer=true) {
  if (!I18N[l]) l = 'fr';
  lang = l; localStorage.setItem('lang', l);
  document.getElementById('langSel').value = l;
  document.documentElement.lang = l;
  buildNav(); if (user) setUserLabel();
  if (currentView) view(currentView); else viewLanding();
  if (user && syncServer) api('PATCH', '/accounts/me/', { preferred_language: l });
}
function matchLang() { const sel = document.getElementById('langSel'); sel.onchange = () => setLang(sel.value); }

function fmt(n) { if (n === undefined || n === null) return '—'; const x = Number(n); if (isNaN(x)) return String(n); try { return x.toLocaleString(lang === 'en' ? 'en-GB' : 'fr-FR') + ' Ar'; } catch (e) { return x + ' Ar'; } }
function headers() { const h = {'Content-Type':'application/json'}; if (token) h['Authorization'] = 'Token ' + token; return h; }
async function api(method, path, body) {
  try {
    const r = await fetch(API + path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
    let data = null;
    try { data = await r.json(); } catch(e) { data = await r.text(); }
    return { status: r.status, data };
  } catch (e) { return { status: 0, data: t('err_unreachable') }; }
}
function msg(text, ok=true) { const d = document.createElement('div'); d.className='msg ' + (ok ? 'ok' : 'err'); d.textContent = text; return d; }
function clearMain() { document.getElementById('main').innerHTML = ''; }
function showNav(show) { /* bottom nav always visible when logged in */ document.getElementById('nav').classList.toggle('hidden', !show); }
function setUserLabel() { document.getElementById('userLabel').textContent = user ? (user.first_name || user.email) : 'Invité'; }
function fmtErr(res) {
  if (!res || res.status === 0) return t('err_unreachable');
  const d = res.data;
  if (typeof d === 'string') return d;
  if (d && d.detail) return d.detail;
  if (d && d.message) return d.message;
  if (d && typeof d === 'object') { return Object.entries(d).map(([k,v]) => Array.isArray(v) ? k+': '+v.join(', ') : k+': '+v).join(' | '); }
  return 'HTTP ' + res.status;
}
function paginateToItems(res) { return (res && res.data && res.data.results) ? res.data.results : (Array.isArray(res && res.data) ? res.data : []); }

async function guestLogin(container) {
  const r = await api('POST', '/accounts/guest/', { language: lang });
  if (r.status === 201 || r.status === 200) {
    token = r.data.token; user = r.data.user;
    localStorage.setItem('token', token); localStorage.setItem('user', JSON.stringify(user));
    setUserLabel(); showNav(true); view('dashboard');
  } else if (container) {
    container.appendChild(msg(fmtErr(r), false));
  }
}

// ---------- Auth ----------
function viewLogin() {
  clearMain(); currentView = 'login';
  const box = document.createElement('div'); box.className='login-box card';
  box.innerHTML = `
    <h2 class="title">${t('login')}</h2>
    <p class="subtitle">${t('login_no_account')} <a href="#" id="go_reg" class="link">${t('login_register_link')}</a></p>
    <label>${t('login_email')}</label><input id="l_email" type="email" autocomplete="username">
    <label>${t('login_pass')}</label><input id="l_pass" type="password" autocomplete="current-password">
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="primary" id="l_btn" style="flex:1">${t('login_btn')}</button>
      <button class="ghost" id="l_guest">${t('login_guest')}</button>
    </div>`;
  document.getElementById('main').appendChild(box);
  document.getElementById('l_btn').addEventListener('click', async () => {
    const res = await api('POST','/accounts/login/', { email: document.getElementById('l_email').value, password: document.getElementById('l_pass').value });
    if (res.status === 200) { token = res.data.token; user = res.data.user; localStorage.setItem('token',token); localStorage.setItem('user',JSON.stringify(user)); if (user.preferred_language) setLang(user.preferred_language, false); setUserLabel(); showNav(true); view('dashboard'); }
    else { box.appendChild(msg(fmtErr(res), false)); }
  });
  document.getElementById('l_guest').addEventListener('click', async () => { await guestLogin(box); });
  document.getElementById('go_reg').addEventListener('click', (e) => { e.preventDefault(); viewRegister(); });
}
function viewRegister() {
  clearMain(); currentView = 'register';
  const box = document.createElement('div'); box.className='login-box card';
  box.innerHTML = `
    <h2 class="title">${t('reg')}</h2>
    <p class="subtitle">${t('reg_already')} <a href="#" id="go_log" class="link">${t('login')}</a></p>
    <label>${t('login_email')}</label><input id="r_email" type="email">
    <label>${t('reg_first')}</label><input id="r_first">
    <label>${t('reg_last')}</label><input id="r_last">
    <label>${t('reg_phone')}</label><input id="r_phone">
    <label>${t('login_pass')}</label><input id="r_pass" type="password">
    <label>${t('reg_pass2')}</label><input id="r_pass2" type="password">
    <div style="margin-top:16px"><button class="primary" id="r_btn" style="width:100%">${t('reg_btn')}</button></div>`;
  document.getElementById('main').appendChild(box);
  document.getElementById('r_btn').addEventListener('click', async () => {
    const p = document.getElementById('r_pass').value, p2 = document.getElementById('r_pass2').value;
    if (p !== p2) { box.appendChild(msg(t('reg_mismatch'), false)); return; }
    const res = await api('POST','/accounts/register/', { email: document.getElementById('r_email').value, password: p, password_confirm: p2, first_name: document.getElementById('r_first').value, last_name: document.getElementById('r_last').value, phone: document.getElementById('r_phone').value, country: 'Madagascar' });
    if (res.status === 201 || res.status === 200) { token = res.data.token; user = res.data.user; localStorage.setItem('token',token); localStorage.setItem('user',JSON.stringify(user)); setUserLabel(); showNav(true); view('dashboard'); }
    else { box.appendChild(msg(fmtErr(res), false)); }
  });
  document.getElementById('go_log').addEventListener('click', (e) => { e.preventDefault(); viewLogin(); });
}

async function viewTransfer() {
  clearMain(); currentView = 'transfer';
  const main = document.getElementById('main');
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h3 class="title">${t('tr_title')}</h3>
    <label>${t('tr_to')}</label><input id="tr_to">

    <label>${t('tr_desc')}</label><input id="tr_desc">
    <div style="margin-top:16px"><button class="primary" id="tr_btn" style="width:100%">${t('tr_btn')}</button></div>`;
  main.appendChild(card);
  document.getElementById('tr_btn').addEventListener('click', async () => {
    const val = parseFloat(document.getElementById('tr_amt').value);
    if (isNaN(val) || val <= 0) { card.appendChild(msg(t('q_amount_invalid'), false)); return; }
    const to = document.getElementById('tr_to').value.trim();
    if (!to) { card.appendChild(msg(t('to_required'), false)); return; }
    const res = await api('POST','/wallet/transfer/', { recipient_email: to, amount: val, description: document.getElementById('tr_desc').value, idempotency_key: crypto.randomUUID() });
    if (res.status === 201 || res.status === 200) { card.appendChild(msg(t('tr_ok'))); setTimeout(()=>view('wallet'),900); }
    else card.appendChild(msg(fmtErr(res), false));
  });
}

    if (res.status === 200 || res.status === 201) {
      const d = res.data;
      div.innerHTML = `<p><b>${t('pay_ref')}:</b> ${d.reference}</p><p>${t('pay_rate')}: ${d.rate} (${d.rate_source})</p><p>${t('pay_est_fee')}: ${fmt(d.estimated_fee)} ${d.origin_currency}</p><p>${t('pay_est_receive')}: ${d.estimated_receive} ${d.destination_currency}</p><p>${t('table_status')}: ${d.status}</p><p class="muted">${d.note||''}</p>`;
    } else div.appendChild(msg(fmtErr(res), false));
  });
  const intl = await api('GET','/payments/international/');
  const c3 = document.createElement('div'); c3.className='card';
  c3.innerHTML = `<h3 class="title">${t('pay_my')}</h3>`;
  const iitems = paginateToItems(intl);
  if (!iitems.length) c3.appendChild(document.createTextNode(t('pay_none')));
  else {
    const tbl = document.createElement('table'); tbl.innerHTML = `<tr><th>${t('pay_ref')}</th><th>${t('table_amount')}</th><th>${t('pay_est_receive')}</th><th>${t('table_status')}</th></tr>`;
    iitems.forEach(x => { const tr=document.createElement('tr'); tr.innerHTML=`<td>${String(x.reference).slice(0,12)}</td><td>${fmt(x.amount)} ${x.origin_currency}</td><td>${x.estimated_receive} ${x.destination_currency}</td><td>${x.status}</td>`; tbl.appendChild(tr); });
    c3.appendChild(tbl);
  }
  main.appendChild(c3);
}

// ---------- Notifications ----------
async function viewNotifications() {
  clearMain(); currentView = 'notifications';
  const main = document.getElementById('main');
  const r = await api('GET','/notifications/');
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h3 class="title">${t('notif_title')}</h3><div style="margin-bottom:8px"><button class="primary" id="readAll">${t('notif_readall')}</button></div>`;
  main.appendChild(card);
  document.getElementById('readAll').addEventListener('click', async () => { await api('POST','/notifications/read-all/'); viewNotifications(); });
  const items = paginateToItems(r);
  if (!items.length) card.appendChild(document.createTextNode(t('notif_none')));
  else items.forEach(n => {
    const div = document.createElement('div'); div.style.padding='8px'; div.style.borderBottom='1px solid var(--border)';
    div.innerHTML = `<b>${n.title}</b> <span class="badge ${n.is_read?'':'unread'}">${n.is_read?t('notif_read_lbl'):t('notif_unread_lbl')}</span><br><span class="muted">${(n.created_at||'').slice(0,19).replace('T',' ')}</span><br>${n.message}`;
    if (!n.is_read) {
      const b = document.createElement('button'); b.textContent = t('notif_read'); b.style.marginTop='4px'; b.className='ghost';
      b.addEventListener('click', async () => { await api('POST','/notifications/'+n.id+'/read/'); viewNotifications(); });
      div.appendChild(b);
    }
    card.appendChild(div);
  });
}

        <label>${t('reg_first')}</label><input id="pf_first" value="${(d.first_name||'').replace(/"/g,'&quot;')}">
        <label>${t('reg_last')}</label><input id="pf_last" value="${(d.last_name||'').replace(/"/g,'&quot;')}">

        <div style="margin-top:12px"><button class="primary" id="pf_save">${t('prof_save')}</button></div>
      </div>
      <div class="card flat">
        <h4 style="margin:0 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase">${t('prof_security')}</h4>
        <p class="muted" style="margin-bottom:8px">Mot de passe, vérification e-mail</p>
        <button class="ghost" onclick="view('security')">Gérer la sécurité</button>
      </div>
      <div class="card flat">

        <p class="muted" style="margin-bottom:8px">Langue, notifications</p>
        <button class="ghost" onclick="view('settings')">Paramètres</button>
      </div>
      <div class="card flat">
        <h4 style="margin:0 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase">${t('prof_support')}</h4>
        <p class="muted" style="margin-bottom:8px">Aide et assistance</p>
        <button class="ghost" onclick="view('support')">Contacter le support</button>
      </div>
    </div>
    <div style="margin-top:16px"><button class="danger" id="pf_logout">${t('prof_logout')}</button></div>`;
  main.appendChild(card);
  document.getElementById('pf_lang').value = d.preferred_language || lang || 'fr';
  document.getElementById('pf_save').addEventListener('click', async () => {
    const payload = { first_name: document.getElementById('pf_first').value, last_name: document.getElementById('pf_last').value, phone: document.getElementById('pf_phone').value, country: document.getElementById('pf_country').value, preferred_language: document.getElementById('pf_lang').value };
    const res = await api('PATCH','/accounts/me/', payload);
    if (res.status === 200) { user = res.data; localStorage.setItem('user',JSON.stringify(user)); setUserLabel(); card.appendChild(msg(t('prof_saved'))); }
    else card.appendChild(msg(fmtErr(res), false));
  });
  document.getElementById('pf_logout').addEventListener('click', async () => {
    await api('POST','/accounts/logout/');

// ---------- QR Code ----------
async function viewQr() {
  clearMain(); currentView = 'qr';
  const main = document.getElementById('main');
  const me = JSON.parse(localStorage.getItem('user') || '{}');
  const email = me.email || '';
  const payload = 'ariary://pay?to=' + email;
  const card = document.createElement('div'); card.className='card';
  card.style.textAlign = 'center';
  card.innerHTML = `
    <h3 class="title">${t('qr_title')}</h3>
    <p class="muted" style="margin-bottom:16px">${t('qr_code')} : <b style="color:var(--accent)">${email}</b></p>
    <div style="background:#fff;padding:16px;border-radius:12px;display:inline-block;margin-bottom:16px">
      <canvas id="qrCanvas" style="display:block"></canvas>
    </div>
    <p class="muted" style="word-break:break-all;font-size:11px;margin-bottom:20px">${payload}</p>
    <div style="border-top:1px solid var(--border);padding-top:16px">
      <h4 style="margin:0 0 12px;color:var(--text)">${t('qr_scan')}</h4>
      <label>${t('qr_payload')}</label><input id="qr_input" placeholder="Collez le code scanné">
      <label>${t('qr_amount')}</label><input id="qr_amt" type="number" value="100" min="1">
      <div style="margin-top:12px"><button class="primary" id="qr_pay" style="width:100%">${icon('send')} ${t('qr_pay')}</button></div>
    </div>`;
  main.appendChild(card);
  try { if (window.QRCode) QRCode.toCanvas(document.getElementById('qrCanvas'), payload, { width: 200, margin: 1 }); } catch(e) {}
  document.getElementById('qr_pay').addEventListener('click', async () => {
    const val = parseFloat(document.getElementById('qr_amt').value);
    let to = document.getElementById('qr_input').value.trim();
    if (to.includes('to=')) to = to.split('to=').pop();
    if (!to) { card.appendChild(msg(t('qr_need_to'), false)); return; }
    if (isNaN(val) || val <= 0) { card.appendChild(msg(t('q_amount_invalid'), false)); return; }
    const res = await api('POST','/wallet/transfer/', { recipient_email: to, amount: val, description: 'Paiement QR', idempotency_key: crypto.randomUUID() });
    if (res.status === 201 || res.status === 200) { card.appendChild(msg(t('qr_ok'))); setTimeout(()=>view('wallet'),900); }
    else card.appendChild(msg(fmtErr(res), false));
  });
}

// ---------- Download helper ----------
async function downloadAuth(path, filename) {
  try {
    const r = await fetch(API + path, { headers: token ? {'Authorization':'Token '+token} : {} });
    if (!r.ok) { alert(fmtErr({status:r.status,data:await r.text()})); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename || 'document'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { alert(t('err_unreachable')); }
}

// ---------- Router ----------
const views = { dashboard:viewDashboard, wallet:viewWallet, transfer:viewTransfer, topup:viewTopup, history:viewHistory, txdetail:viewTxdetail, transit:viewTransit, shipmentcreate:viewShipmentcreate, shipmentdetail:viewShipmentdetail, customs:viewCustoms, customscreate:viewCustomscreate, customsdetail:viewCustomsdetail, blockchain:viewBlockchain, payments:viewPayments, notifications:viewNotifications, profile:viewProfile, qr:viewQr, security:viewSecurity, settings:viewSettings, support:viewSupport, landing:viewLanding, login:viewLogin, register:viewRegister };
function view(name) {
  currentView = name && views[name] ? name : 'dashboard';
  if (views[currentView]) views[currentView]();
  else viewDashboard();
  document.querySelectorAll('.bottom-nav button').forEach(x => x.classList.toggle('active', x.dataset.view === currentView));
}
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const items = [
    ['dashboard', t('nav_home'), 'home'], ['wallet', t('nav_wallet'), 'wallet'],
    ['transit', t('nav_transit'), 'package'], ['profile', t('nav_profile'), 'user'],
  ];
  items.forEach(([v, label, ic]) => {
    const b = document.createElement('button');
    b.dataset.view = v;
    b.innerHTML = icon(ic) + '<span>' + label + '</span>';
    b.addEventListener('click', () => view(v));
    nav.appendChild(b);
  });
  nav.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.view === currentView));
}

// ---------- Boot ----------
(function boot() {
  if (!lang) lang = (user && user.preferred_language) || 'fr';
  lang = I18N[lang] ? lang : 'fr';
  document.getElementById('langSel').value = lang;
  document.documentElement.lang = lang;
  matchLang();
  buildNav();
  if (token && user) { setUserLabel(); showNav(true); view('dashboard'); }
  else { setUserLabel(); showNav(false); viewLanding(); }
})();
</script>
