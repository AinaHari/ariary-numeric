<div class="scene" id="scene-05" data-scene="05-transfert">
  <div class="scene-content">
    <div class="phone-mockup">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div style="background: var(--bg-2); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border);">
          <span style="font-size: 12px; font-weight: 700; color: var(--text);">Envoyer</span>
          <span style="font-size: 12px; color: var(--muted);">✕</span>
        </div>
        <div style="padding: 20px 16px;">
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 4px;">Destinataire</label>
            <input type="email" value="marie@example.mg" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-2); color: var(--text); font-size: 13px;">
          </div>
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 4px;">Montant (MGA)</label>
            <input type="number" value="10000" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-2); color: var(--text); font-size: 13px; font-family: var(--mono);">
          </div>
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 4px;">Description (optionnel)</label>
            <input type="text" value="Remboursement déjeuner" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-2); color: var(--text); font-size: 13px;">
          </div>
          <div style="background: var(--bg-3); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px;">
              <span>Montant</span><span style="color: var(--text); font-family: var(--mono);">10 000 Ar</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px;">
              <span>Frais</span><span style="color: var(--text); font-family: var(--mono);">0 Ar</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px;">
              <span>Total</span><span style="font-family: var(--mono);">10 000 Ar</span>
            </div>
          </div>
          <button style="width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer;">Confirmer le transfert</button>
        </div>
      </div>
    </div>
    <div style="text-align: center; margin-top: 16px; color: var(--muted); font-size: 11px;">Transfert de démonstration — aucun argent réel n'est déplacé.</div>
  </div>
</div>
